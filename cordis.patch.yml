# The dsh-kokoro bundle patch.
#
# `dsh plugin --profile <name> add github:jwilson411/dsh-kokoro` installs this
# package into the profile, sees the `dsh.bundle.patch` field in its
# package.json, and appends the package to the profile manifest's ordered
# `dsh.profile.bundles` list. This file is then composed as one layer over the
# bundles below it and under the profile's own cordis.patch.yml.
#
# One insert, one row: the Kokoro function plugin. A later layer — the
# profile's cordis.patch.yml or a `--patch` overlay — addresses the row by its
# `id` to point it at a server:
#
#   - id: kokoro
#     config:
#       baseURL: http://127.0.0.1:8765
#
# Note that an id-targeted patch replaces the row's whole `config` rather than
# merging into it, so an override must restate the fields it keeps.
#
# No config is set here on purpose. Left alone the plugin uses
# http://127.0.0.1:8000, or DSH_KOKORO_BASE_URL if it is set. The companion
# server, github.com/jwilson411/kokoro-tts-api, listens on 8765 by default.

- insert:
    - id: kokoro
      name: dsh-kokoro
